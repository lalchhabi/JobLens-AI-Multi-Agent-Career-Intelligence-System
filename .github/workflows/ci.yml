# Name of the workflow
name: JobLens AI CI

# When should pipeline run?
on:
  # Run when code is pushed
  push:
    # Only run for this branches
    branches:
      - master

  # Run when PR is created to main branch
  pull_request:
    branches: ['master']

# Jobs (task to run)
jobs:
  build: 

    # OS environment for CI runner
    runs-on: ubuntu-latest

    # Steps
    steps:

      # Step 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python Environment in CI machine
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Basic Import test
      - name: Verify Application Import
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACEHUB_ACCESS_TOKEN: ${{ secrets.HUGGINGFACEHUB_ACCESS_TOKEN }}
        run: |
          python -c "from app.main import app"

      # Step 5: Build docker Image
      - name: Build Docker Image
        run: |
          docker build -t joblens-ai .

  

        