<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobLens AI</title>
    <link rel="stylesheet" href="/static/css/animation.css">
    <link rel="stylesheet" href="/static/css/buttons.css">
    <link rel="stylesheet" href="/static/css/cards.css">
    <link rel="stylesheet" href="/static/css/forms.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    <link rel="stylesheet" href="/static/css/progress.css">
    <link rel="stylesheet" href="/static/css/result.css">
    <link rel="stylesheet" href="/static/css/toast.css">
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
        <span class="wordmark">JobLens</span>
        <span class="label">AI Career Intelligence</span>
    </header>

    <!-- MAIN -->
    <main class="main">

        <div class="header">
            <h1>Analyze your fit for a role</h1>
            <p>
                Upload a resume and paste the job description. Seven agents
                assess your match, surface skill gaps, and draft your
                application.
            </p>
        </div>

        <div class="input-section">

            <div class="card input-card">

                <div class="card-header">
                    <h3>Resume</h3>
                </div>

                <label class="upload-btn">
                    <input
                        type="file"
                        id="resume"
                        accept="application/pdf,.pdf"
                        class="visually-hidden">

                    <div class="upload-content">

                    <strong id="uploadLabel">Choose a file</strong>

                    <span>PDF · max 5 MB</span>

                    </div>

                </label>

            </div>

            <div class="card input-card">

                <div class="card-header">
                    <h3>Job description</h3>
                </div>

                <textarea
                    id="jobDescription"
                    placeholder="Paste the full job description here…"></textarea>

            </div>

        </div>

        <div class="action">

            <button
                id="analyzeBtn"
                class="primary-btn">

                Analyze

            </button>

        </div>

        <div id="result" class="result">

            <div class="empty-state">
                Your analysis will appear here.
            </div>

        </div>

    </main>

</div>

<!-- State -->
<script src="/static/js/state.js"></script>

<!-- UI -->
<script src="/static/js/ui.js"></script>

<!-- Renderers -->
<script src="/static/js/renderers/resume.js"></script>
<script src="/static/js/renderers/job.js"></script>
<script src="/static/js/renderers/gap.js"></script>
<script src="/static/js/renderers/interview.js"></script>
<script src="/static/js/renderers/roadmap.js"></script>
<script src="/static/js/renderers/market.js"></script>
<script src="/static/js/renderers/coverletter.js"></script>

<!-- API -->
<script src="/static/js/api.js"></script>
<!-- Navigation -->
<script src="/static/js/navigation.js"></script>


<!-- Main App -->
<script src="/static/js/app.js"></script>

</body>
</html>
